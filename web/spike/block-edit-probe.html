  <title>限定ブロック編集の計測</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body { overflow: auto; }
    .probe-toolbar { padding: 16px; }
    .probe-toolbar button, .block-actions button { min-height: 44px; margin: 4px; }

  </style>

<body>
  <div class="probe-toolbar">
    <h1>限定ブロック編集の計測</h1>

    <button id="undo">元に戻す</button>
    <output id="result" aria-live="polite"></output>
  </div>
  <div class="file-view wrap"><div class="code" id="lines"></div></div>
  <script type="module" src="/src/spike/block-edit-probe.ts"></script>
