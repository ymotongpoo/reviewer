<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Viewport 計測</title>
  <style>
    body { font: 16px sans-serif; margin: 16px; padding-bottom: 140px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button { min-height: 44px; margin: 4px; }
    #keyboard { position: fixed; bottom: 0; left: 0; box-sizing: border-box; width: 100%; height: 96px; font: inherit; }
    .measure { position: absolute; visibility: hidden; width: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Viewport 計測</h1>
  <p>回転、アドレスバー、キーボード、画面分割、文字サイズを変えて測定します。</p>
  <button id="visual">resizes-visual に切り替え</button>
  <button id="content">resizes-content に切り替え</button>
  <button id="save">JSON を保存</button>
  <pre id="current"></pre>
  <h2>測定履歴</h2>
  <pre id="history"></pre>
  <label for="keyboard">画面下端の入力欄</label>
  <textarea id="keyboard" placeholder="キーボードを開いて重なりを確認します"></textarea>
  <script type="module" src="/src/spike/viewport-probe.ts"></script>
</body>
</html>
